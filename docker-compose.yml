services:
  asvet-antispam:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-}
      - CHAT_ID=${CHAT_ID:-}
      - ADMIN_IDS=${ADMIN_IDS:-}
      - SOCKS5_URL=${SOCKS5_URL:-}
      - BANNED_PATTERNS=${BANNED_PATTERNS:-}
      - MIN_ACCOUNT_AGE_DAYS=${MIN_ACCOUNT_AGE_DAYS:-7}
      - FLOOD_MAX_MESSAGES=${FLOOD_MAX_MESSAGES:-5}
      - FLOOD_WINDOW_SECONDS=${FLOOD_WINDOW_SECONDS:-10}
      - CAPTCHA_TIMEOUT_SECONDS=${CAPTCHA_TIMEOUT_SECONDS:-120}
      - DB_PATH=${DB_PATH:-/app/data/bot.db}
    restart: unless-stopped
    networks:
      - proxy-shared
    volumes:
      - asvet-bot-data:/app/data

volumes:
  asvet-bot-data:
    external: true
    name: asvet-bot-data

networks:
  proxy-shared:
    external: true
    name: proxy-shared

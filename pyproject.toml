[project]
name = "asvet-antispam-bot"
version = "0.1.0"
description = "Антиспам-бот для Telegram-чата про AI и автоматизацию в бизнесе"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "alarmic" }
]
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "aiohttp-socks>=0.10,<1",
    "onnxruntime>=1.18,<2",
    "tokenizers>=0.15,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Только для одноразового экспорта HF-модели в ONNX.
# torch ставим CPU-вариант: обычный torch тянет за собой CUDA-библиотеки
# (~3 ГБ nvidia-*), из-за чего каждая сборка образа занимала ~15 минут.
# Для экспорта модели в ONNX CUDA не нужна.
export = [
    "torch>=2.5,<2.6",
    "transformers>=4.46,<4.48",
    "optimum>=1.23,<1.25",
    "onnx>=1.16,<2",
]

# Зависимости для разработки и запуска тестов.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = true
# Глобальный индекс для CPU-сборок torch: без него ставится CUDA-вариант.
# Нужно, чтобы uv тянул torch из cpu-индекса, а не из pypi (там default + cuda).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
asvet-bot = "bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project]
name = "asvet-antispam-bot"
version = "0.1.0"
description = "Антиспам-бот для Telegram-чата про AI и автоматизацию в бизнесе"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "alarmic" }
]
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "aiohttp-socks>=0.10,<1",
    "onnxruntime>=1.18,<2",
    "tokenizers>=0.15,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Только для одноразового экспорта HF-модели в ONNX.
# Версии зафиксированы: torch 2.5 + transformers 4.47 + optimum 1.23
# — стабильная комбинация, проверенная с rubert-tiny-toxicity.
export = [
    "torch>=2.5,<2.6",
    "transformers>=4.46,<4.48",
    "optimum>=1.23,<1.25",
    "onnx>=1.16,<2",
]

[project.scripts]
asvet-bot = "bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.uv]
package = true
